name: build

# 1. tests   : the headless GDScript suites (always).
# 2. android : debug APK (always, uses Google's TEST AdMob app id) and a signed release AAB (only when the
#              keystore secrets exist). The same steps (SDK packages, templates, plugin v5.1.0, export commands) were run
#              by hand in the authoring environment and produced a debug APK and a throw-away-signed AAB; this
#              YAML itself has never been executed on GitHub Actions, so its first run is its real verification.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      admob_plugin_tag:
        description: "poingstudios/godot-admob-plugin tag"
        default: "v5.1.0"

env:
  GODOT_VERSION: "4.7.2"
  ADMOB_PLUGIN_TAG: ${{ github.event.inputs.admob_plugin_tag || 'v5.1.0' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo install -m755 Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import || true
      - name: Content validation
        run: python3 tools/validate_content.py
      - name: Test suites
        run: |
          godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee test.log
          ! grep -E "^FAIL|SCRIPT ERROR|Parse Error" test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-log, path: test.log }

  android:
    needs: tests
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }   # Godot 4.7.2 + AGP 8.6.1 exports were verified with JDK 21
      - uses: android-actions/setup-android@v3
      - name: Android SDK packages (versions from Godot 4.7.2 platform/android/java/app/config.gradle)
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;3.10.2.4988404"
      - name: Install Godot + export templates
        run: |
          B="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "$B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL -o tpz.zip "$B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && sudo install -m755 Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates && unzip -q tpz.zip -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: AdMob plugin
        env:
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
        run: tools/ci/install_admob.sh "$ADMOB_PLUGIN_TAG" "$GODOT_VERSION"
      - name: Import + Android build template
        run: |
          godot --headless --path . --import || true
          mkdir -p build/android
      - name: Debug APK (debug keystore generated on the fly; AdMob TEST ids)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          godot --headless --path . --install-android-build-template --export-debug "Android Debug (APK)" build/android/imperium-debug.apk
          test -s build/android/imperium-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging build/android/imperium-debug.apk | grep -E "^package|targetSdkVersion|native-code"
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump xmltree build/android/imperium-debug.apk --file AndroidManifest.xml | grep -A2 "gms.ads.APPLICATION_ID"
      - name: Release AAB (only when signing secrets are configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          godot --headless --path . --export-release "Android Release (AAB)" build/android/imperium-release.aab
          test -s build/android/imperium-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: build/android/*
